name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Only Windows is tested so far; see "What was tested" in the README.
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest
      - run: python -m pytest -q
        env:
          PYTHONPATH: src
