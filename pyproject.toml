[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agentroot"
version = "0.1.0.dev0"
description = "One folder per project for Claude Code, Codex and Antigravity: find every session, worktree and path each agent recorded, then reorganize without losing history."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Marcus Voloch" }]
keywords = ["claude-code", "codex", "antigravity", "ai-agents", "sessions", "worktrees"]
classifiers = [
  "Environment :: Console",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
agentroot = "agentroot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
